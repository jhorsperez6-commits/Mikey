<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Tu Key</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 2px solid #00bfff; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
        h1 { color: #00bfff; font-size: 22px; margin-bottom: 5px; font-weight: bold; }
        .subtitle { color: #00ff88; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 18px; border-radius: 10px; margin-bottom: 20px; }
        .key-title { font-size: 12px; color: #aaa; margin-bottom: 10px; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 20px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .btn { background: #00ff88; color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn:active { transform: scale(0.98); }
        .info { font-size: 11px; color: #8c91a0; margin-top: 18px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">¡Anuncios Completados con Éxito!</div>

        <div class="key-box">
            <div class="key-title">Tu Key Única del Sistema:</div>
            <div class="key-text" id="assignedKey">SPH-GOD-882</div>
        </div>

        <button class="btn" onclick="copiarKey()">Copiar Key al Portapapeles</button>

        <div class="info">
            Copia esta key y pégala directamente dentro de tu ejecutor de Roblox.
        </div>
    </div>

    <script>
        // Banco directo de 1000 keys para selección instantánea
        var keysBank = [];
        var prefs = ["SPH", "VIP", "GOD", "PRO", "LUA", "HUB", "ELITE", "X", "K", "Z"];
        for (var i = 1; i <= 1000; i++) {
            keysBank.push(prefs[i % prefs.length] + "-" + i + "-" + (i * 33).toString(36).toUpperCase());
        }

        // Si el usuario ya tiene su key guardada se mantiene, de lo contrario le asigna una al instante
        var miKey = localStorage.getItem("mikey_user_key");
        if (!miKey) {
            miKey = keysBank[Math.floor(Math.random() * keysBank.length)];
            localStorage.setItem("mikey_user_key", miKey);
        }

        // Se muestra inmediatamente en pantalla
        document.getElementById("assignedKey").innerText = miKey;

        function copiarKey() {
            var keyTexto = document.getElementById("assignedKey").innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyTexto).then(function() {
                    alert("¡Key copiada al portapapeles!");
                });
            } else {
                alert("Tu key es: " + keyTexto);
            }
        }
    </script>

</body>
</html>
