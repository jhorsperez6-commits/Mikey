<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Asignación de Key</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 2px solid #00bfff; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
        h1 { color: #00bfff; font-size: 22px; margin-bottom: 5px; font-weight: bold; }
        .subtitle { color: #00ff88; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
        .user-id-box { font-size: 14px; color: #00bfff; background: #1a1c23; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 18px; border-radius: 10px; margin-bottom: 20px; }
        .key-title { font-size: 12px; color: #aaa; margin-bottom: 10px; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 20px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 12px; border-radius: 6px; border: 1px solid #333; }
        .btn { background: #00ff88; color: #000; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .btn:active { transform: scale(0.98); }
        .info { font-size: 11px; color: #8c91a0; margin-top: 18px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">¡Anuncios Completados con Éxito!</div>

        <!-- MUESTRA EL NÚMERO ASIGNADO DENTRO DE LOS 1000 USUARIOS -->
        <div class="user-id-box">
            Tu Número Asignado: <span id="numUsuario" style="color: #00ff88; font-weight: bold;">#---</span> / 1000
        </div>

        <div class="key-box">
            <div class="key-title">Tu Key Única del Sistema:</div>
            <div class="key-text" id="assignedKey">Cargando...</div>
        </div>

        <button class="btn" onclick="copiarKey()">Copiar Key al Portapapeles</button>

        <div class="info">
            Se te ha asignado un número único de las 1000 keys disponibles. Copia tu key y pégala dentro de tu ejecutor de Roblox.
        </div>
    </div>

    <script>
        // BANCO CON LAS 1000 KEYS DENTRO DEL CÓDIGO
        var keys1000 = {};
        var prefijos = ["SPH", "VIP", "GOD", "PRO", "LUA", "HUB", "ELITE", "X", "K", "Z"];

        for (var i = 1; i <= 1000; i++) {
            var pref = prefijos[i % prefijos.length];
            var hash = (i * 157 + 83).toString(36).toUpperCase();
            keys1000[i] = pref + "-" + i + "-" + hash;
        }

        // ASIGNAR AUTOMÁTICAMENTE UN NÚMERO DEL 1 AL 1000 A ESTE NAVEGADOR
        var miNumero = localStorage.getItem("sph_numero_asignado_v1");

        if (!miNumero) {
            // Si entra por primera vez, le asigna un número aleatorio entre el 1 y el 1000
            miNumero = Math.floor(Math.random() * 1000) + 1;
            localStorage.setItem("sph_numero_asignado_v1", miNumero);
        }

        // MOSTRAR EN PANTALLA SU NÚMERO Y SU KEY
        document.getElementById("numUsuario").innerText = "#" + miNumero;
        document.getElementById("assignedKey").innerText = keys1000[miNumero];

        function copiarKey() {
            var texto = document.getElementById("assignedKey").innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(texto).then(function() {
                    alert("¡Key copiada al portapapeles!");
                });
            } else {
                alert("Tu key es: " + texto);
            }
        }
    </script>

</body>
</html>
