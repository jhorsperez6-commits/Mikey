    <script>
        // Generador matemático complejo para que las 300 keys sean imposibles de adivinar
        function generarKeyImposible(index) {
            const prefijos = ["ALEX", "FLY", "VIP", "GOD", "PRO", "HUB", "ELITE", "X", "Z", "KRN"];
            const p1 = prefijos[index % prefijos.length];
            
            let hash = 0;
            const seed = "ALEX11_SECURE_SALT_" + (index * 997) + "_PROTECTED";
            for (let i = 0; i < seed.length; i++) {
                hash = ((hash << 5) - hash) + seed.charCodeAt(i);
                hash = hash & hash;
            }
            const partA = Math.abs(hash).toString(36).toUpperCase().padStart(5, "0").slice(0, 5);
            const partB = Math.abs(hash * 31).toString(36).toUpperCase().padStart(5, "0").slice(0, 5);
            
            return `${p1}-${partA}-${partB}`;
        }

        const DIEZ_HORAS = 10 * 60 * 60 * 1000;

        function obtenerKeyExclusiva() {
            document.getElementById("inicio").style.display = "none";
            document.getElementById("cargando").style.display = "block";

            setTimeout(() => {
                const hoyStr = new Date().toDateString();
                let storedDate = localStorage.getItem("alex_date_v2");
                let assignedIndex = localStorage.getItem("alex_index_v2");
                let timestamp = localStorage.getItem("alex_time_v2");
                let currentKey = localStorage.getItem("alex_key_string_v2");
                const ahora = Date.now();

                // Si cambió el día, se reinicia el contador
                if (storedDate !== hoyStr) {
                    localStorage.setItem("alex_date_v2", hoyStr);
                    localStorage.setItem("alex_global_count_v2", "0");
                    localStorage.removeItem("alex_index_v2");
                    localStorage.removeItem("alex_time_v2");
                    localStorage.removeItem("alex_key_string_v2");
                    assignedIndex = null;
                }

                // Si ya tiene una key activa, se mantiene
                if (assignedIndex && timestamp && currentKey && (ahora - parseInt(timestamp)) < DIEZ_HORAS) {
                    mostrarPantallaKey(assignedIndex, timestamp, currentKey);
                    return;
                }

                let globalCount = parseInt(localStorage.getItem("alex_global_count_v2") || "0");
                
                if (globalCount >= 300) {
                    alert("¡Las 300 keys de hoy se han agotado! Vuelve mañana.");
                    location.reload();
                    return;
                }

                globalCount++;
                assignedIndex = globalCount;
                timestamp = ahora;
                let nuevaKeyGenerada = generarKeyImposible(parseInt(assignedIndex));

                // Registrar la key generada en el servidor (api.php) para que aparezca en el panel
                fetch(`http://panelwep.freepage.cc/api.php?action=generate&custom_key=${encodeURIComponent(nuevaKeyGenerada)}`)
                    .then(response => response.json())
                    .catch(err => console.log("Sincronizado localmente"));

                // Guardar almacenamiento local
                localStorage.setItem("alex_global_count_v2", globalCount);
                localStorage.setItem("alex_index_v2", assignedIndex);
                localStorage.setItem("alex_time_v2", timestamp);
                localStorage.setItem("alex_key_string_v2", nuevaKeyGenerada);

                mostrarPantallaKey(assignedIndex, timestamp, nuevaKeyGenerada);
            }, 1500);
        }

        function mostrarPantallaKey(index, timestamp, keyStr) {
            document.getElementById("numero").innerText = "#" + index + " / 300";
            document.getElementById("keyText").innerText = keyStr;

            document.getElementById("cargando").style.display = "none";
            document.getElementById("resultado").style.display = "block";

            iniciarContador(parseInt(timestamp));
            setInterval(() => iniciarContador(parseInt(timestamp)), 1000);
        }

        function iniciarContador(timestampOriginal) {
            const restante = DIEZ_HORAS - (Date.now() - timestampOriginal);

            if (restante <= 0) {
                localStorage.removeItem("alex_index_v2");
                localStorage.removeItem("alex_time_v2");
                localStorage.removeItem("alex_key_string_v2");
                location.reload();
                return;
            }

            const h = Math.floor(restante / 3600000);
            const m = Math.floor((restante % 3600000) / 60000);
            const s = Math.floor((restante % 60000) / 1000);

            document.getElementById("timer").innerText =
                String(h).padStart(2, "0") + "h " +
                String(m).padStart(2, "0") + "m " +
                String(s).padStart(2, "0") + "s";
        }

        function copiarKey() {
            const key = document.getElementById("keyText").innerText;
            navigator.clipboard.writeText(key).then(() => {
                alert("¡Key copiada al portapapeles con éxito!");
            });
        }

        window.onload = function () {
            const hoyStr = new Date().toDateString();
            let storedDate = localStorage.getItem("alex_date_v2");
            let assignedIndex = localStorage.getItem("alex_index_v2");
            let timestamp = localStorage.getItem("alex_time_v2");
            let currentKey = localStorage.getItem("alex_key_string_v2");

            if (storedDate === hoyStr && assignedIndex && timestamp && currentKey && (Date.now() - parseInt(timestamp)) < DIEZ_HORAS) {
                document.getElementById("inicio").style.display = "none";
                mostrarPantallaKey(assignedIndex, timestamp, currentKey);
            }
        };
    </script>
