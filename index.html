<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Key</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: #050508;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #0c0c12;
            border: 1px solid #1a1a24;
            border-radius: 28px;
            width: 100%;
            max-width: 380px;
            padding: 40px 24px 32px;
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            border: 2px solid #2a8a9a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 22px;
            font-size: 26px;
            font-weight: 700;
            color: #3ecfdf;
            font-family: Georgia, serif;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #f0f0f5;
            margin-bottom: 6px;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .subtitle {
            color: #777790;
            font-size: 13px;
            margin-bottom: 28px;
        }

        /* Pantalla inicial */
        #inicio {
            display: block;
        }

        .btn-generar {
            background: #3ecfdf;
            color: #000;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Animación */
        #cargando {
            display: none;
            padding: 30px 0;
        }

        .loader {
            width: 42px;
            height: 42px;
            border: 3px solid #1e1e2a;
            border-top: 3px solid #3ecfdf;
            border-radius: 50%;
            margin: 0 auto 18px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Resultado */
        #resultado {
            display: none;
        }

        .info-box {
            background: #111118;
            border: 1px solid #1e1e2a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            text-align: left;
        }

        .info-box .label {
            font-size: 12px;
            color: #777790;
            margin-bottom: 4px;
        }

        .info-box .value {
            font-size: 16px;
            color: #3ecfdf;
            font-weight: 600;
        }

        .key-box {
            background: #111118;
            border: 1px solid #2a8a9a;
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 18px;
        }

        .key-box .label {
            font-size: 12px;
            color: #777790;
            margin-bottom: 10px;
        }

        .key-box .key {
            font-family: 'Courier New', monospace;
            font-size: 17px;
            color: #3ecfdf;
            font-weight: 700;
            word-break: break-all;
            background: #0a0a0f;
            padding: 12px;
            border-radius: 10px;
        }

        .btn-copiar {
            background: #3ecfdf;
            color: #000;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .aviso {
            margin-top: 18px;
            font-size: 12px;
            color: #888899;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">SP</div>
        <h1>Serve Pene Hub</h1>
        <div class="subtitle">Sistema de Keys • 1500 disponibles</div>

        <!-- PANTALLA INICIO -->
        <div id="inicio">
            <p style="color:#777790; font-size:14px; margin-bottom:24px; line-height:1.5;">
                Toca el botón para generar tu key única de acceso.
            </p>
            <button class="btn-generar" onclick="generarKey()">Generar Key</button>
        </div>

        <!-- CARGANDO -->
        <div id="cargando">
            <div class="loader"></div>
            <div style="color:#3ecfdf; font-size:15px;">Creando tu key...</div>
        </div>

        <!-- RESULTADO -->
        <div id="resultado">
            <div class="info-box">
                <div class="label">Número de serie</div>
                <div class="value" id="numero">#--- / 1500</div>
            </div>

            <div class="info-box">
                <div class="label">Tiempo restante</div>
                <div class="value" id="timer">10h 00m 00s</div>
            </div>

            <div class="key-box">
                <div class="label">Tu Key Única</div>
                <div class="key" id="keyText">------</div>
            </div>

            <button class="btn-copiar" onclick="copiarKey()">Copiar Key</button>

            <div class="aviso">
                Esta key es de un solo uso y expira en 10 horas.<br>
                Pégala en el ejecutor de Roblox.
            </div>
        </div>
    </div>

    <script>
        // ================== GENERADOR DE KEYS (1 a 1500) ==================
        function crearKey(numero) {
            const prefijos = ["SPH", "VIP", "GOD", "PRO", "LUA", "HUB", "ELITE", "X", "K", "Z"];
            const pref = prefijos[numero % prefijos.length];

            let hash = 0;
            const texto = "SPH_SECRET_2026_" + numero + "_SERVEPENE";
            for (let i = 0; i < texto.length; i++) {
                hash = ((hash << 5) - hash) + texto.charCodeAt(i);
                hash = hash & hash;
            }
            const hashHex = Math.abs(hash).toString(16).toUpperCase().padStart(6, "0").slice(0, 6);
            return pref + "-" + numero + "-" + hashHex;
        }

        const DIEZ_HORAS = 10 * 60 * 60 * 1000;

        function generarKey() {
            document.getElementById("inicio").style.display = "none";
            document.getElementById("cargando").style.display = "block";

            setTimeout(() => {
                let numero = localStorage.getItem("sph_num_v4");
                let timestamp = localStorage.getItem("sph_time_v4");
                const ahora = Date.now();

                // Si no tiene key o ya expiró → generar nueva
                if (!numero || !timestamp || (ahora - parseInt(timestamp)) >= DIEZ_HORAS) {
                    // Número secuencial limitado a 1500
                    let contador = parseInt(localStorage.getItem("sph_contador_v4") || "0");
                    contador = contador + 1;
                    if (contador > 1500) contador = 1;

                    numero = contador;
                    timestamp = ahora;

                    localStorage.setItem("sph_num_v4", numero);
                    localStorage.setItem("sph_time_v4", timestamp);
                    localStorage.setItem("sph_contador_v4", contador);
                }

                document.getElementById("numero").innerText = "#" + numero + " / 1500";
                document.getElementById("keyText").innerText = crearKey(parseInt(numero));

                document.getElementById("cargando").style.display = "none";
                document.getElementById("resultado").style.display = "block";

                actualizarTimer();
                setInterval(actualizarTimer, 1000);
            }, 2000);
        }

        function actualizarTimer() {
            const timestamp = parseInt(localStorage.getItem("sph_time_v4"));
            const restante = DIEZ_HORAS - (Date.now() - timestamp);

            if (restante <= 0) {
                location.reload();
                return;
            }

            const h = Math.floor(restante / 3600000);
            const m = Math.floor((restante % 3600000) / 60000);
            const s = Math.floor((restante % 60000) / 1000);

            document.getElementById("timer").innerText =
                String(h).padStart(2, "0") + "h " +
                String(m).padStart(2, "0") + "m " +
                String(s).padStart(2, "0") + "s";
        }

        function copiarKey() {
            const key = document.getElementById("keyText").innerText;
            navigator.clipboard.writeText(key).then(() => {
                alert("Key copiada correctamente");
            });
        }

        // Si ya tiene una key válida, mostrar directo
        window.onload = function () {
            const numero = localStorage.getItem("sph_num_v4");
            const timestamp = localStorage.getItem("sph_time_v4");
            if (numero && timestamp && (Date.now() - parseInt(timestamp)) < DIEZ_HORAS) {
                document.getElementById("inicio").style.display = "none";
                document.getElementById("numero").innerText = "#" + numero + " / 1500";
                document.getElementById("keyText").innerText = crearKey(parseInt(numero));
                document.getElementById("resultado").style.display = "block";
                actualizarTimer();
                setInterval(actualizarTimer, 1000);
            }
        };
    </script>
</body>
</html>
